
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090D18">

    <title>Crear cuenta - ShipsApp</title>

    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/liquid-glass.css">
    <link rel="stylesheet" href="../styles/responsive.css">
</head>

<body>

    <main class="auth-screen">

        <a href="index.html" class="back-button">
            ← Volver
        </a>

        <section class="auth-container glass">

            <div class="auth-logo">
                <span>💬</span>
            </div>

            <h1>Únete a ShipsApp</h1>

            <p class="auth-description">
                Crea tu cuenta y comienza a conectar.
            </p>

            <form id="registerForm">

                <div class="profile-upload">
                    <label for="profilePhoto">
                        <div class="photo-preview" id="photoPreview">
                            <span>📷</span>
                        </div>
                        <p>Agregar foto de perfil</p>
                    </label>

                    <input
                        type="file"
                        id="profilePhoto"
                        accept="image/*"
                        hidden
                    >
                </div>

                <div class="input-group">
                    <label for="country">País</label>

                    <select id="country" name="country" required>
                        <option value="">Selecciona tu país</option>
                        <option value="US">Estados Unidos</option>
                        <option value="MX">México</option>
                        <option value="CO">Colombia</option>
                        <option value="VE">Venezuela</option>
                        <option value="ES">España</option>
                        <option value="AR">Argentina</option>
                        <option value="CL">Chile</option>
                        <option value="PE">Perú</option>
                        <option value="DO">República Dominicana</option>
                        <option value="OTHER">Otro</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="displayName">Nombre de muestra</label>

                    <input
                        type="text"
                        id="displayName"
                        name="displayName"
                        placeholder="¿Cómo te llamas?"
                        maxlength="40"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="newUsername">Usuario</label>

                    <input
                        type="text"
                        id="newUsername"
                        name="username"
                        placeholder="Elige un usuario"
                        minlength="3"
                        maxlength="20"
                        pattern="[a-zA-Z0-9_]+"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="newPassword">Contraseña</label>

                    <input
                        type="password"
                        id="newPassword"
                        name="password"
                        placeholder="Crea una contraseña"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <p id="registerError" class="error-message"></p>

                <button type="submit" class="glass-button primary">
                    Crear cuenta
                </button>

            </form>

            <p class="auth-footer">
                ¿Ya tienes cuenta?
                <a href="login.html">Inicia sesión</a>
            </p>

        </section>

    </main>

    <script type="module" src="../scripts/auth.js"></script>

</body>
</html>
