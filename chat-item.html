
<div class="chat-item" data-chat-id="">

    <div class="chat-item-avatar">
        <img
            src="../assets/images/default-avatar.png"
            alt="Avatar del contacto"
        >
        <span class="online-indicator"></span>
    </div>

    <div class="chat-item-info">

        <div class="chat-item-header">
            <h3 class="chat-item-name">Nombre del contacto</h3>
            <time class="chat-item-time">12:30</time>
        </div>

        <div class="chat-item-preview">
            <p class="last-message">Último mensaje...</p>

            <span class="unread-count" hidden>0</span>
        </div>

    </div>

</div>
