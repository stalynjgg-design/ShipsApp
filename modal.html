
<div class="modal-overlay" id="shipsModal" hidden>

    <div class="modal-content glass" role="dialog"
         aria-modal="true" aria-labelledby="modalTitle">

        <button
            type="button"
            class="modal-close"
            id="closeModal"
            aria-label="Cerrar ventana">
            ✕
        </button>

        <div class="modal-icon" id="modalIcon">
            💬
        </div>

        <h2 id="modalTitle">Título de la ventana</h2>

        <p id="modalDescription">
            Descripción de la ventana.
        </p>

        <div class="modal-body" id="modalBody">
        </div>

        <div class="modal-actions">
            <button
                type="button"
                class="glass-button secondary"
                id="cancelModal">
                Cancelar
            </button>

            <button
                type="button"
                class="glass-button primary"
                id="confirmModal">
                Confirmar
            </button>
        </div>

    </div>

</div>
